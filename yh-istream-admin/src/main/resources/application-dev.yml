spring:
  datasource:
    # MySQL 9.7.2 LTS
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.20.155:3306/yh_istream?connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&cacheCallableStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&cacheServerConfiguration=true&elideSetAutoCommits=true&tcpKeepAlive=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      keepalive-time: 30000
      connection-test-query: SELECT 1

  # ==================== PostgreSQL 备选配置 ====================
  # 如需切换 PostgreSQL，注释上方 MySQL 配置，启用下方配置：
  # datasource:
  #   driver-class-name: org.postgresql.Driver
  #   url: jdbc:postgresql://localhost:5432/yh_istream?currentSchema=public
  #   username: postgres
  #   password: postgres

  # Flyway 数据库迁移
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    locations: classpath:db/migration
    # MySQL 使用下方配置
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
#      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 10000ms

# Redisson 配置
redisson:
  config: |
    singleServerConfig:
      address: "redis://${spring.data.redis.host}:${spring.data.redis.port}"
      database: ${spring.data.redis.database}
      timeout: 10000
      connectionPoolSize: 64
      connectionMinimumIdleSize: 10

# Sa-Token 开发环境降低超时
sa-token:
  timeout: 2592000

# XXL-Job 配置（开发环境可选启用）
xxl:
  job:
    enabled: false
    admin:
      addresses: http://localhost:8080/xxl-job-admin
    executor:
      appname: yh-istream-job
      port: 9999
      logpath: ./logs/xxl-job
      logretentiondays: 30

# 日志
logging:
  level:
    root: INFO
    com.istream: DEBUG
    org.springframework.web: DEBUG

# MyBatis-Plus SQL 日志（仅开发环境）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl