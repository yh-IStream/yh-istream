spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/yh_istream?connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&sslMode=PREFERRED&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&cacheCallableStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&cacheServerConfiguration=true&elideSetAutoCommits=true&tcpKeepAlive=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      keepalive-time: 30000
      validation-timeout: 5000
      pool-name: YhIstreamHikariCP
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# OSS 存储配置
oss:
  type: ${OSS_TYPE:local}
  local:
    upload-path: ${OSS_PATH:/data/uploads}
    url-prefix: /files

# Sa-Token 配置
sa-token:
  is-log: false
  is-print: false

# Knife4j Next 配置（生产环境关闭）
knife4j:
  enable: false

# SpringDoc 配置（生产环境关闭）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# CORS 跨域配置（生产环境必须指定具体域名，多个用逗号分隔）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 日志
logging:
  level:
    root: WARN
    com.istream: INFO
  file:
    name: /data/logs/yh-istream/app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 5GB

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: false

# XXL-Job 分布式任务调度
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN:http://xxl-job-admin:8080/xxl-job-admin}
    executor:
      appname: yh-istream
      port: 9999
      logpath: /data/logs/xxl-job
      logretentiondays: 30