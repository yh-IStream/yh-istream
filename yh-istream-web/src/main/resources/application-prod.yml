spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/yh_istream?createDatabaseIfNotExist=true&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&sslMode=PREFERRED&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&cacheCallableStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&cacheServerConfiguration=true&elideSetAutoCommits=true&tcpKeepAlive=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      keepalive-time: 30000
      validation-timeout: 5000
      pool-name: YhIstreamHikariCP
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# OSS 存储配置
oss:
  type: ${OSS_TYPE:local}
  local:
    upload-path: ${OSS_PATH:/data/uploads}
    url-prefix: /files

# Redisson 配置（JsonJacksonCodec：Redis 数据可读、可跨语言、更安全）
redisson:
  config: |
    codec: !<org.redisson.codec.JsonJacksonCodec> {}
    singleServerConfig:
      address: "redis://${spring.data.redis.host}:${spring.data.redis.port}"
      password: "${REDIS_PASSWORD}"
      database: ${spring.data.redis.database}
      timeout: 5000
      connectionPoolSize: 128
      connectionMinimumIdleSize: 20

# Sa-Token 配置
sa-token:
  is-log: false
  is-print: false

captcha:
  enabled: true

# Knife4j Next 配置（生产环境关闭）
knife4j:
  enable: false

# SpringDoc 配置（生产环境关闭）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# CORS 跨域配置（生产环境必须指定具体域名，多个用逗号分隔）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 日志（滚动策略由 logback-spring.xml 管理，此处仅配置级别和路径）
logging:
  level:
    root: WARN
    com.istream: INFO

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: false