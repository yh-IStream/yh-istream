spring:
  datasource:
    # MySQL 9.7.2 LTS
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/yh_istream?createDatabaseIfNotExist=true&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&cacheCallableStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&cacheServerConfiguration=true&elideSetAutoCommits=true&tcpKeepAlive=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123321}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      keepalive-time: 30000
      connection-test-query: SELECT 1

  # ==================== PostgreSQL 备选配置 ====================
  # 如需切换 PostgreSQL，注释上方 MySQL 配置，启用下方配置：
  # datasource:
  #   driver-class-name: org.postgresql.Driver
  #   url: jdbc:postgresql://localhost:5432/yh_istream?currentSchema=public
  #   username: postgres
  #   password: postgres

  # Flyway 数据库迁移
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    clean-disabled: true
    locations: classpath:db/migration
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
#      password:
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 10000ms

  # ===== AI 模型连接（二选一，注释掉不用的） =====
  # 方式 A：Ollama 本地（免费，需先 ollama pull qwen2.5:7b && ollama serve）
#  ai:
#    ollama:
#      base-url: http://localhost:11434
#      chat:
#        options:
#          model: qwen2.5:7b
#          temperature: 0.3
  # 方式 B：OpenRouter 云端（免费额度使用，注册获取 key → 系统环境变量 OPENROUTER_API_KEY）
  ai:
    model:
      chat: openai
    openai:
      base-url: https://openrouter.ai/api/v1
      api-key: ${OPENROUTER_API_KEY:}
      chat:
        model: cohere/north-mini-code:free
        temperature: 0.3
        max-tokens: 1500

# Redisson 配置（JsonJacksonCodec：Redis 数据可读、可跨语言、更安全）
redisson:
  config: |
    codec: !<org.redisson.codec.JsonJacksonCodec> {}
    singleServerConfig:
      address: "redis://${spring.data.redis.host}:${spring.data.redis.port}"
      database: ${spring.data.redis.database}
      timeout: 10000
      connectionPoolSize: 64
      connectionMinimumIdleSize: 10

# Sa-Token 开发环境降低超时
sa-token:
  timeout: 2592000

captcha:
  enabled: false

# 日志
logging:
  level:
    root: INFO
    com.istream: DEBUG
    org.springframework.web: DEBUG

    org.springframework.ai.openai: DEBUG
    org.springframework.ai.chat.client: DEBUG
    org.springframework.web.client: DEBUG
#    org.springframework.ai: DEBUG
#    org.springframework.boot.autoconfigure: DEBUG

# MyBatis-Plus SQL 日志（仅开发环境）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
#    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ==================== AI 配置（开发环境启用） ====================
# 如未安装 Ollama / 无 OpenRouter key，AI 会自动降级为 NoOp（启动不报错）
#istream:
#  ai:
#    enabled: true
#    provider: ollama
#    mcp:
#      enabled: true

# ===== 如果用 OpenRouter 而不是 Ollama，改 provider 并取消注释上面的方式 B =====
istream:
 ai:
   enabled: true
   provider: openai
   mcp:
     enabled: true